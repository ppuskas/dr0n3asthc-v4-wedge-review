0,1168]}],"errors":[]}</script>
<script>
(() => {
  const data = JSON.parse(document.getElementById("dashboard-data").textContent);
  const matrix = document.getElementById("matrix");
  const previewLink = document.getElementById("preview-link");
  const previewImage = document.getElementById("preview-image");
  const previewValue = document.getElementById("preview-value");
  const previewNote = document.getElementById("preview-note");
  const hoverData = document.getElementById("hover-data");
  const inputButton = document.getElementById("show-input");
  const samplerLabel = value => value
    .replaceAll("_", " ")
    .replace(/\bdpmpp\b/i, "DPM++")
    .replace(/\bdpm\b/i, "DPM")
    .replace(/\bpc\b/i, "PC")
    .replace(/\b\w/g, letter => letter.toUpperCase());
  const key = (denoise, sampler) => `${Number(denoise)}|${sampler}`;
  const items = new Map(data.items.map(item => [key(item.denoise, item.sampler), item]));

  document.getElementById("title").textContent = data.title;
  document.getElementById("count").textContent = `${data.items.length} combinations`;
  document.getElementById("settings").textContent = [
    data.seed !== null && data.seed !== undefined ? `Seed ${data.seed}` : "",
    data.steps ? `${data.steps} steps` : "",
    data.cfg ? `CFG ${data.cfg}` : "",
    data.scheduler || ""
  ].filter(Boolean).join(" · ");
  matrix.style.setProperty("--sampler-count", data.samplers.length);

  const itemLabel = item => `Denoise ${Number(item.denoise).toFixed(2)} · ${samplerLabel(item.sampler)}`;
  const select = item => {
    previewLink.href = item.image;
    previewImage.src = item.image;
    previewImage.alt = itemLabel(item);
    previewValue.textContent = itemLabel(item);
    previewNote.textContent = data.seed !== null && data.seed !== undefined ? `Seed ${data.seed}` : "";
  };
  const positionTooltip = (x, y) => {
    const gap = 14;
    const left = Math.max(10, Math.min(x + gap, innerWidth - hoverData.offsetWidth - 10));
    const top = Math.max(10, Math.min(y + gap, innerHeight - hoverData.offsetHeight - 10));
    hoverData.style.left = `${left}px`;
    hoverData.style.top = `${top}px`;
  };
  const showTooltip = (item, x, y) => {
    hoverData.textContent = itemLabel(item);
    hoverData.hidden = false;
    positionTooltip(x, y);
  };
  const hideTooltip = () => { hoverData.hidden = true; };
  const bind = (button, item) => {
    button.addEventListener("pointerenter", event => {
      select(item);
      showTooltip(item, event.clientX, event.clientY);
    });
    button.addEventListener("pointermove", event => positionTooltip(event.clientX, event.clientY));
    button.addEventListener("pointerleave", hideTooltip);
    button.addEventListener("focus", () => {
      select(item);
      const rect = button.getBoundingClientRect();
      showTooltip(item, rect.right, rect.top);
    });
    button.addEventListener("blur", hideTooltip);
    button.addEventListener("click", () => select(item));
  };

  const corner = document.createElement("div");
  corner.className = "matrix-header";
  corner.textContent = "Denoise";
  matrix.append(corner);
  data.samplers.forEach(sampler => {
    const header = document.createElement("div");
    header.className = "matrix-header";
    header.textContent = samplerLabel(sampler);
    matrix.append(header);
  });
  data.denoises.forEach(denoise => {
    const row = document.createElement("div");
    row.className = "matrix-row-label";
    row.textContent = Number(denoise).toFixed(2);
    matrix.append(row);
    data.samplers.forEach(sampler => {
      const item = items.get(key(denoise, sampler));
      const button = document.createElement("button");
      button.type = "button";
      button.className = "matrix-cell";
      button.setAttribute("aria-label", itemLabel(item));
      const image = document.createElement("img");
      image.src = item.thumb || item.image;
      image.alt = "";
      button.append(image);
      bind(button, item);
      matrix.append(button);
    });
  });

  if (data.input) {
    inputButton.hidden = false;
    inputButton.addEventListener("click", () => {
      previewLink.href = data.input.image;
      previewImage.src = data.input.image;
      previewImage.alt = data.input.label || "Workflow input";
      previewValue.textContent = data.input.label || "Workflow input";
      previewNote.textContent = "";
    });
  }
  window.addEventListener("scroll", hideTooltip, true);
  select(data.items[0]);
})();
</script>
